spring.application.name=planner

# PostgreSQL Database Connection Configurations
spring.datasource.url=jdbc:postgresql://localhost:5432/user_planner_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA Lifecycle Settings
# "update" automatically updates the DB tables to match your Java models on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect